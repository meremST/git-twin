name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Linux quality checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  package:
    name: Build Linux archive
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build archive and check release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 scripts/package-release.py --tag "$REF_NAME"
          else
            python3 scripts/package-release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: target/dist/*
          if-no-files-found: error

  install:
    name: Install on ${{ matrix.os }}
    needs: package
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Verify and install both launchers without Cargo
        working-directory: dist
        run: |
          sha256sum --check *.sha256
          tar -xzf git-twin-*.tar.gz
          install -d "$HOME/bin"
          install -m 0755 git-twin-*/gitt git-twin-*/git-tui "$HOME/bin/"
          export PATH="$HOME/bin:$PATH"
          gitt --version
          gitt --help
          git tui --version
          git tui -h
          git-tui --help
          git tui doctor
          sh git-twin-*/scripts/uninstall.sh
          test ! -e "$HOME/bin/gitt"
          test ! -e "$HOME/bin/git-tui"
