name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  draft:
    name: Create draft release
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist
      - name: Create draft with verified binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="dist/git-twin-${version}-x86_64-unknown-linux-gnu.tar.gz"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --verify-tag --draft --title "Git Twin $RELEASE_TAG" \
            --notes-file dist/RELEASE_NOTES.md
